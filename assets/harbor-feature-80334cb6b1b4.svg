<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
<title id="title">Harbor — an agent in your browser</title><desc id="desc">Original animated workflow illustration: a cursor highlights a page while an agent uses visual and DOM context, browser tools and streaming progress. This is not a screenshot or a recorded run.</desc>
<style>text{font-family:Arial,sans-serif}.mono{font-family:ui-monospace,monospace}.cursor{animation:cursor 12s ease-in-out infinite;transform:translate(842px,155px)}
